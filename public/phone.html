<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE6">
<title>Midnight Express</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    --me:var(--ink);                       /* your train's colour, set on welcome */
    background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fp-body);
    display:flex;flex-direction:column;height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
  }
  .wrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .hide{display:none!important}

  /* ---------------- join ---------------- */
  #join{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s4);padding:var(--s6) var(--s5)}
  #join h1{margin:0 0 var(--s2);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.01em}
  #join .tag{margin:0 0 var(--s3);color:var(--ink-2);font-size:var(--fp-lg);line-height:1.4}
  #join .tag b{color:var(--ink);display:block}
  input[type=text]{
    width:100%;min-height:var(--touch-min);padding:0 var(--s4);border-radius:var(--r-md);
    border:var(--line) solid var(--ink);background:var(--white);color:var(--ink);
    font-size:var(--fp-lg);font-family:var(--sans)
  }
  input[type=text]::placeholder{color:var(--ink-3)}
  .btn + .btn, .btn + a.btn{margin-top:-4px}
  a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center}

  /* ---------------- header ---------------- */
  #stripe{height:10px;background:var(--me);flex:0 0 auto}
  header{padding:var(--s3) var(--s4);border-bottom:var(--line) solid var(--ink);
         display:flex;align-items:center;gap:var(--s3);background:var(--white)}
  .dot{width:18px;height:18px;border-radius:4px;flex:0 0 auto;border:var(--line) solid var(--ink)}
  .route{flex:1;min-width:0}
  .route b{display:block;font-size:var(--fp-lg);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .budget{text-align:right;flex:0 0 auto}
  .budget b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

  /* ---------------- status ---------------- */
  #status{padding:var(--s5) var(--s4) var(--s3);text-align:center}
  #where{font-size:var(--fp-xl);font-weight:700;margin-top:var(--s2)}
  #progWrap{height:8px;background:var(--paper-3);border-radius:4px;margin-top:var(--s4);overflow:hidden}
  #prog{height:100%;width:0;background:var(--me);transition:width .18s linear}

  /* ---------------- steering ---------------- */
  #steerWrap{flex:1;min-height:0;overflow-y:auto;padding:var(--s2) var(--s4)}
  #steerWrap > .eyebrow{margin:var(--s4) 2px var(--s3)}
  .choice{
    width:100%;min-height:var(--touch-min);display:flex;align-items:center;gap:var(--s3);
    padding:0 var(--s4);margin-bottom:10px;border-radius:var(--r-md);
    border:var(--line) solid var(--ink);background:var(--white);color:var(--ink);
    text-align:left;font-family:var(--sans)
  }
  .choice .n{flex:1;font-size:var(--fp-lg);font-weight:600}
  .choice .tag,.choice .occ{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
                            padding:3px 7px;border-radius:var(--r-sm)}
  .choice .tag{background:var(--ink);color:var(--white)}
  .choice .occ{border:var(--line) solid var(--red);color:var(--red)}
  .choice.sel{background:var(--me);border-color:var(--me);color:var(--white)}
  .choice.sel .tag{background:var(--white);color:var(--ink)}
  .choice.sel .occ{border-color:var(--white);color:var(--white)}

  /* ---------------- throttle ---------------- */
  #throttleWrap{padding:var(--s3) var(--s4) var(--s4);border-top:var(--line) solid var(--ink);background:var(--paper-2)}
  #throttle{
    width:100%;height:84px;border-radius:var(--r-md);border:var(--line) solid var(--ink);
    background:var(--white);color:var(--ink);font-size:var(--fp-lg);letter-spacing:.04em;text-transform:uppercase;
    font-weight:700;touch-action:none;font-family:var(--sans)
  }
  #throttle.on{background:var(--me);color:var(--white);border-color:var(--me)}

  /* ---------------- auction: the whole phone turns red ---------------- */
  #auction{
    position:fixed;inset:0;z-index:50;padding:var(--s6) var(--s5);
    display:flex;flex-direction:column;justify-content:center;gap:var(--s4);
    background:var(--red);color:var(--white);
    animation:slam .25s cubic-bezier(.2,1.4,.4,1)
  }
  @keyframes slam{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
  #auction .eyebrow{color:var(--white)}
  #segName{margin:0;font-size:var(--fp-display);font-weight:700;line-height:1.1}
  #timer{height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
  #timerFill{height:100%;width:100%;background:var(--white)}
  #bidVal{font-size:var(--fp-bid);font-weight:700;text-align:center;line-height:1;letter-spacing:-.02em}
  /* Cabin's figures are proportional; box each digit so a moving number does not wobble */
  #bidVal i,#budgetTxt i{display:inline-block;font-style:normal;width:.64em;text-align:center}
  input[type=range]{width:100%;height:52px;accent-color:var(--white)}
  .quick{display:flex;gap:var(--s2)}
  .quick button{
    flex:1;min-height:52px;border-radius:var(--r-md);border:var(--line) solid var(--white);
    background:transparent;color:var(--white);font-size:var(--fp-body);font-weight:700;font-family:var(--sans)
  }
  .quick button:active{background:var(--white);color:var(--red)}
  .rivals{font-size:var(--fp-body);color:rgba(255,255,255,.85);text-align:center;min-height:18px}

  /* ---------------- end ---------------- */
  #end{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s4);
       padding:var(--s6) var(--s5)}
  #end h2{margin:0;font-size:var(--fp-huge);font-weight:700;line-height:1;letter-spacing:-.01em}
  .stat{display:flex;justify-content:space-between;align-items:baseline;
        padding:var(--s3) 0;border-bottom:var(--line) solid var(--paper-3);font-size:var(--fp-body)}
  .stat span{color:var(--ink-2)}
  .stat b{font-size:var(--fp-xl);font-weight:700;font-variant-numeric:tabular-nums}
  a.explorer{
    display:flex;align-items:center;justify-content:center;min-height:var(--touch-min);
    border-radius:var(--r-md);background:var(--ink);border:var(--line) solid var(--ink);
    color:var(--white);text-decoration:none;font-size:var(--fp-body);font-weight:700;padding:var(--s3)
  }
  #myBids a.explorer{background:var(--white);color:var(--ink)}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(128px + env(safe-area-inset-bottom));   /* clear of the throttle */
    background:var(--ink);color:var(--white);
    padding:12px 18px;border-radius:var(--r-md);font-size:var(--fp-body);font-weight:600;
    z-index:60;opacity:0;transition:opacity .2s;pointer-events:none
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <section id="join">
    <h1>Midnight<br>Express</h1>
    <p class="tag">Forty trains. One network.<b>Not enough track.</b></p>
    <input id="name" type="text" placeholder="Your name" autocomplete="off" maxlength="16" enterkeyhint="go">
    <button class="btn" id="joinBtn">Board the train</button>
    <button class="btn btn--ghost" id="spectate">Just watching</button>
    <a class="btn btn--ghost" href="/how">How to play</a>
  </section>

  <section id="game" class="wrap hide">
    <div id="stripe"></div>
    <header>
      <div class="dot" id="dot"></div>
      <div class="route"><b id="routeTxt">—</b><span class="eyebrow">Your route</span></div>
      <div class="budget"><b id="budgetTxt" class="num">100</b><span class="eyebrow">Tokens</span></div>
    </header>
    <div id="status">
      <div class="eyebrow" id="statusLine">waiting for departure</div>
      <div id="where">—</div>
      <div id="progWrap"><div id="prog"></div></div>
    </div>
    <div id="steerWrap">
      <div class="eyebrow" id="choiceLbl">Choose your next track</div>
      <div id="choices"></div>
    </div>
    <div id="throttleWrap"><button id="throttle">Hold to run</button></div>
  </section>

  <section id="end" class="hide">
    <h2 id="endTitle">Arrived</h2>
    <div>
      <div class="stat"><span>Delay</span><b id="eDelay">—</b></div>
      <div class="stat"><span>Auctions won / lost</span><b id="eWL">—</b></div>
      <div class="stat"><span>Tokens spent / earned</span><b id="eTok">—</b></div>
      <div class="stat"><span>Final balance</span><b id="eBal">—</b></div>
    </div>
    <a class="explorer hide" id="explorer" target="_blank" rel="noopener">View this run on Solana →</a>
    <div id="myBids"></div>
    <button class="btn btn--ghost" id="again">Ride again</button>
  </section>
</div>

<div id="auction" class="hide">
  <div class="eyebrow">Track contested</div>
  <p id="segName">—</p>
  <div id="timer"><div id="timerFill"></div></div>
  <div id="bidVal">0</div>
  <input type="range" id="bidRange" min="0" max="100" value="0" aria-label="Your bid">
  <div class="quick">
    <button data-pct="0">Pass</button><button data-pct="25">25%</button>
    <button data-pct="50">50%</button><button data-pct="100">All in</button>
  </div>
  <div class="rivals" id="rivals"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const proto = location.protocol === "https:" ? "wss:" : "ws:";
let ws, me = null, net = null, curAuction = null, tickHz = 20;
const myAuctions = [];   // { auctionId, sig, explorerUrl } for auctions I was in

/* iOS Safari has NO Vibration API, so the auction alert cannot rely on haptics.
   WebAudio needs a user gesture to unlock -- the Board button provides it. */
let actx = null;
function unlockAudio(){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); } catch {} }
function chime(freqs = [880, 1320], dur = 0.16) {
  if (!actx) return;
  freqs.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    const t = actx.currentTime + i * dur;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  });
}
function buzz(p){ try { navigator.vibrate?.(p); } catch {} }
function alertPlayer(){ chime([1320, 880, 1320], .14); buzz([0,80,60,80]); }

function toast(msg, ms = 1900) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), ms);
}
function send(o){ if (ws?.readyState === 1) ws.send(JSON.stringify(o)); }
/** Numbers that change while you watch get one fixed-width box per digit. */
function setNum(el, v) { const s = String(v); if (el.dataset.v === s) return; el.dataset.v = s; el.innerHTML = [...s].map((c) => `<i>${c}</i>`).join(""); }
const budgetNum = () => Number($("budgetTxt").dataset.v ?? $("budgetTxt").textContent) || 0;

function connect() {
  ws = new WebSocket(`${proto}//${location.host}/?role=player`);
  ws.onopen = () => toast("Connected");
  ws.onclose = () => { toast("Reconnecting…"); setTimeout(connect, 1200); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
connect();

function handle(m) {
  switch (m.t) {
    case "hello":   net = m.network; tickHz = m.tickHz || 20; break;
    case "welcome": onWelcome(m); break;
    case "state":   onState(m); break;
    case "auction": if (m.auction.bidders.some(b => b.trainId === me)) openAuction(m.auction); break;
    case "settled": onSettled(m.settlement); break;
    case "arrived": if (m.trainId === me) { chime([660,990],.2); } break;
    case "runEnd":  onRunEnd(m.summary); break;
    case "auctionSig": onAuctionSig(m); break;
    case "receipt": onReceipt(m.receipt); break;
    case "reset":   location.reload(); break;
  }
}

$("joinBtn").onclick = () => {
  unlockAudio();
  send({ t: "join", name: $("name").value.trim() });
  $("joinBtn").disabled = true; $("joinBtn").textContent = "Boarding…";
};
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("joinBtn").click(); });
$("spectate").onclick = () => { unlockAudio(); $("join").classList.add("hide");
  $("game").classList.remove("hide"); $("statusLine").textContent = "spectating"; };

function onWelcome(m) {
  me = m.trainId; net = m.network || net;
  $("join").classList.add("hide"); $("game").classList.remove("hide");
  $("dot").style.background = m.color; document.body.style.setProperty("--me", m.color);
  $("routeTxt").textContent = `${net.nodes[m.origin].name} → ${net.nodes[m.destination].name}`;
  setNum($("budgetTxt"), m.budget);
  $("bidRange").max = m.budget;
  chime([660, 990], .18);
  toast(`You are ${m.name}`);
}

function onState(m) {
  if (!me) return;
  const t = m.trains.find(x => x.id === me); if (!t) return;
  setNum($("budgetTxt"), t.budget);
  $("bidRange").max = Math.max(1, t.budget);
  const nm = (k) => net.nodes[k]?.name ?? k;

  if (t.state === "arrived") {
    $("statusLine").textContent = "home"; $("where").textContent = nm(t.destination);
    $("prog").style.width = "100%";
  } else if (t.state === "on_segment") {
    $("statusLine").textContent = "running";
    $("where").textContent = `${nm(t.from)} → ${nm(t.to)}`;
    $("prog").style.width = (t.progress * 100) + "%";
  } else if (t.state === "waiting") {
    $("statusLine").textContent = "held at signal";
    $("where").textContent = nm(t.node); $("prog").style.width = "0%";
  } else {
    $("statusLine").textContent = "at platform";
    $("where").textContent = nm(t.node); $("prog").style.width = "0%";
  }
  renderChoices(t, m);
}

function renderChoices(t, state) {
  const box = $("choices"), lbl = $("choiceLbl");
  if (t.state === "arrived") {
    lbl.textContent = "Journey complete";
    if (box.dataset.sig !== "") { box.dataset.sig = ""; box.innerHTML = ""; }
    return;
  }
  // Pre-select while in transit -- otherwise an 8s leg is dead air on the phone.
  const inTransit = t.state === "on_segment" && t.to;
  const junction = inTransit ? t.to : t.node;
  lbl.textContent = inTransit
    ? `Next junction · ${net.nodes[junction].name}`
    : "Choose your next track";

  const rec = recommend(junction, t.destination);
  const html = net.segments.filter(s => s.a === junction || s.b === junction).map(s => {
    const to = s.a === junction ? s.b : s.a;
    const occupied = state.segments[s.id] && state.segments[s.id] !== t.id;
    return `<button class="choice ${to===rec?"rec":""} ${to===t.steer?"sel":""}" data-to="${to}">
      <span class="n">${net.nodes[to].name}</span>
      ${to===rec?'<span class="tag">Fastest</span>':""}
      ${occupied?'<span class="occ">Occupied</span>':""}</button>`;
  }).join("");
  if (box.dataset.sig !== html) { box.dataset.sig = html; box.innerHTML = html; }
}

$("choices").addEventListener("click", (e) => {
  const b = e.target.closest(".choice"); if (!b) return;
  send({ t: "steer", toNode: b.dataset.to });
  buzz(15); chime([990], .07);
  [...$("choices").children].forEach(c => c.classList.remove("sel"));
  b.classList.add("sel");
  toast(`Routing via ${net.nodes[b.dataset.to].name}`, 1200);
});

function recommend(from, to) {
  const adj = {};
  for (const s of net.segments){ (adj[s.a] ||= []).push([s.b,s.length]); (adj[s.b] ||= []).push([s.a,s.length]); }
  const dist = {[from]:0}, prev = {}, q = new Set(Object.keys(net.nodes));
  while (q.size) {
    let u = null;
    for (const n of q) if (dist[n] !== undefined && (u === null || dist[n] < dist[u])) u = n;
    if (u === null) break;
    q.delete(u); if (u === to) break;
    for (const [v,w] of adj[u] || []) {
      const alt = dist[u] + w;
      if (dist[v] === undefined || alt < dist[v]) { dist[v] = alt; prev[v] = u; }
    }
  }
  if (dist[to] === undefined) return null;
  let cur = to; const path = [to];
  while (cur !== from) { cur = prev[cur]; path.unshift(cur); }
  return path[1];
}

const th = $("throttle");
let held = false;
const setThrottle = (v) => { send({ t:"throttle", value:v });
  th.classList.toggle("on", v > 0.5); th.textContent = v > 0.5 ? "Running" : "Hold to run"; };
th.addEventListener("pointerdown", e => { e.preventDefault(); held = true; setThrottle(1); });
const rel = e => { e.preventDefault?.(); held = false; setThrottle(0.35); };
th.addEventListener("pointerup", rel);
th.addEventListener("pointercancel", rel);
th.addEventListener("pointerleave", e => { if (held) rel(e); });
setTimeout(() => setThrottle(1), 400);

let auctionTimer = null;
function openAuction(a) {
  curAuction = a;
  $("auction").classList.remove("hide");
  $("segName").textContent = a.segmentName;
  const budget = budgetNum() || 100;
  $("bidRange").max = Math.max(1, budget);
  $("bidRange").value = 0; setNum($("bidVal"), 0);
  $("rivals").textContent = a.bidders.filter(b => b.trainId !== me).map(b => b.name).join(" · ") + " also want this track";
  alertPlayer();

  const total = a.msRemaining || 8000, t0 = performance.now();
  clearInterval(auctionTimer);
  auctionTimer = setInterval(() => {
    const left = Math.max(0, total - (performance.now() - t0));
    $("timerFill").style.width = (left / total * 100) + "%";
    if (left <= 0) { clearInterval(auctionTimer); closeAuction(); }
  }, 50);
}
function closeAuction(){ $("auction").classList.add("hide"); curAuction = null; }

$("bidRange").addEventListener("input", e => {
  setNum($("bidVal"), e.target.value);
  if (curAuction) send({ t:"bid", auctionId: curAuction.auctionId, amount:+e.target.value });
});
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => {
  const amt = Math.floor((+$("bidRange").max) * (+b.dataset.pct) / 100);
  $("bidRange").value = amt; setNum($("bidVal"), amt);
  if (curAuction) send({ t:"bid", auctionId: curAuction.auctionId, amount: amt });
  buzz(20); chime([1180], .06);
});

function onSettled(s) {
  if (curAuction && s.auctionId === curAuction.auctionId) closeAuction();
  if (s.winner === me) { toast(`Track won — paid ${s.pricePaid}`); chime([880,1320],.13); }
  else if (s.compensation && s.compensation[me] !== undefined) {
    toast(`Held. Compensated ${s.compensation[me]}`); chime([440],.2); }
}

function onRunEnd(summary) {
  const t = summary.trains.find(x => x.id === me);
  $("game").classList.add("hide"); $("auction").classList.add("hide"); $("end").classList.remove("hide");
  if (!t) { $("endTitle").textContent = "Run complete"; return; }
  $("endTitle").textContent = t.arrived ? "Arrived" : "Stranded";
  $("eDelay").textContent = `${(t.delayTicks / tickHz).toFixed(1)}s`;
  $("eWL").textContent = `${t.auctionsWon} / ${t.auctionsLost}`;
  $("eTok").textContent = `${t.spent} / ${t.earned}`;
  $("eBal").textContent = t.budget;
  renderMyBids();
}
function onAuctionSig(m) {
  if (!m.explorerUrl) return;
  if (myAuctions.some((x) => x.auctionId === m.auctionId)) return;
  myAuctions.push({ auctionId: m.auctionId, sig: m.sig, explorerUrl: m.explorerUrl });
  renderMyBids();
}

/** The closing beat: the judge taps this and sees the auction they just bid in. */
function renderMyBids() {
  const box = $("myBids"); if (!box) return;
  if (!myAuctions.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="eyebrow" style="margin:var(--s4) 0 var(--s2)">Your bids on-chain</div>` +
    myAuctions.map((a, i) => `<a class="explorer" style="margin-bottom:8px;font-size:var(--fp-micro)"
        href="${a.explorerUrl}" target="_blank" rel="noopener">Auction ${i + 1} · ${a.sig.slice(0, 10)}… →</a>`).join("");
}

function onReceipt(r) {
  if (!r?.explorerUrl) return;
  const a = $("explorer"); a.href = r.explorerUrl; a.classList.remove("hide");
}
$("again").onclick = () => location.reload();
</script>
</body>
</html>
