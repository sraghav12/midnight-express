name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: benchmark runs and is deterministic
        run: |
          node scripts/bench.js --json > a.json
          node scripts/bench.js --json > b.json
          cmp a.json b.json

  docker:
    name: docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t midnight-express .
      - run: |
          docker run -d -p 8080:8080 --name me midnight-express
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
          curl -fs http://localhost:8080/health | grep -q '"ok":true'
          curl -fs http://localhost:8080/play | grep -q "Midnight Express"
